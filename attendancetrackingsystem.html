<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Leave Tracking System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(-45deg,#74ebd5,#ACB6E5,#89f7fe,#66a6ff);
    background-size:400% 400%;
    animation:bgAnimation 10s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:550px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    text-align:center;
    color:#0d47a1;
    margin-bottom:20px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        color:#1565c0;
        text-shadow:0 0 5px #64b5f6;
    }
    to{
        color:#0d47a1;
        text-shadow:0 0 20px #2196f3;
    }
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
    color:#0d47a1;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:2px solid #90caf9;
    border-radius:8px;
    transition:0.3s;
}

input:focus,
textarea:focus{
    border-color:#1976d2;
    box-shadow:0 0 10px #64b5f6;
    outline:none;
}

textarea{
    height:80px;
    resize:none;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:linear-gradient(90deg,#2196f3,#0d47a1);
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    background:linear-gradient(90deg,#0d47a1,#2196f3);
    box-shadow:0 0 15px #42a5f5;
}

table{
    width:100%;
    margin-top:25px;
    border-collapse:collapse;
    animation:fadeIn 1.5s ease;
}

table,th,td{
    border:1px solid #1976d2;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
}

td{
    text-align:center;
    padding:10px;
}

tr:nth-child(even){
    background:#e3f2fd;
}

tr:hover{
    background:#bbdefb;
    transition:0.3s;
}
</style>

</head>
<body>

<div class="container">
    <h1>Student Leave Tracking System</h1>

    <form id="leaveForm">

        <label>Student ID</label>
        <input type="number" id="studentId" placeholder="Enter Student ID" required>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter Student Name" required>

        <label>Class</label>
        <input type="text" id="studentClass" placeholder="Enter Class" required>

        <label>Section</label>
        <input type="text" id="studentSection" placeholder="Enter Section" required>

        <label>Leave Reason</label>
        <textarea id="reason" placeholder="Enter Leave Reason" required></textarea>

        <button type="submit">Apply Leave</button>

    </form>

    <table id="leaveTable">
        <tr>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Leave Reason</th>
        </tr>
    </table>
</div>

<script>
document.getElementById("leaveForm").addEventListener("submit", function(event){
    event.preventDefault();

    let studentId = document.getElementById("studentId").value;
    let studentName = document.getElementById("studentName").value;
    let studentClass = document.getElementById("studentClass").value;
    let studentSection = document.getElementById("studentSection").value;
    let reason = document.getElementById("reason").value;

    if(studentId==="" || studentName==="" || studentClass==="" || studentSection==="" || reason===""){
        alert("Please enter all details.");
        return;
    }

    let table = document.getElementById("leaveTable");
    let row = table.insertRow();

    row.insertCell(0).innerHTML = studentId;
    row.insertCell(1).innerHTML = studentName;
    row.insertCell(2).innerHTML = studentClass;
    row.insertCell(3).innerHTML = studentSection;
    row.insertCell(4).innerHTML = reason;

    alert("Leave Application Submitted Successfully!");

    document.getElementById("leaveForm").reset();
});
</script>

</body>
</html>
